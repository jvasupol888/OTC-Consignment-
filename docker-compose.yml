services:
  postgres:
    image: postgres:16-alpine
    container_name: otc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: otc
      POSTGRES_PASSWORD: otc
      POSTGRES_DB: otc_consignment
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otc -d otc_consignment"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: otc_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - ./.docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # สร้าง bucket สำหรับรูปหลักฐานอัตโนมัติเมื่อ minio พร้อม
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/otc-evidence;
      mc anonymous set none local/otc-evidence;
      echo 'MinIO bucket otc-evidence ready';
      "
