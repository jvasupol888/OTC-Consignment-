  <body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">
    
    <div id="app-container" class="flex-1 flex flex-col print:hidden">
      <!-- 1. Login Container -->
      <div id="view-login" class="hidden">
        <?!= include('LoginPanel'); ?>
      </div>
      
      <!-- 2. Admin Container -->
      <div id="view-admin" class="hidden flex-1 flex flex-col">
        <?!= include('AdminPanel'); ?>
      </div>
    </div>
    
    <!-- Print Container -->
    <div id="print-area" class="hidden print:block bg-white text-black w-full min-h-screen"></div>

    <script>
      // Global User Session State
      let currentUser = null;

      // On Load
      window.onload = function() {
        checkSession();
      };
      
      function checkSession() {
        const storedUser = sessionStorage.getItem('otc_user');
        if (storedUser) {
          try {
            currentUser = JSON.parse(storedUser);
            routeBasedOnRole(currentUser);
          } catch(e) {
            sessionStorage.removeItem('otc_user');
            showView('login');
          }
        } else {
          showView('login');
        }
      }
      
      function routeBasedOnRole(user) {
        currentUser = user;
        if (user.Role === 'System_Admin' || user.Role === 'Admin') {
          showView('admin');
          if (window.initializeAdminPanel) {
            window.initializeAdminPanel();
          }
        } else if (user.Role === 'Sale') {
          alert("คุณกำลังเข้าสู่ระบบผ่านลิงก์สำหรับ Admin กรุณาใช้ลิงก์ของ Mobile App สำหรับเซลล์ครับ");
          sessionStorage.removeItem('otc_user');
          showView('login');
        } else {
          sessionStorage.removeItem('otc_user');
          showView('login');
        }
      }
      
      function showView(viewName) {
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-admin').classList.add('hidden');
        
        if (viewName === 'login') {
          document.getElementById('view-login').classList.remove('hidden');
        } else if (viewName === 'admin') {
          document.getElementById('view-admin').classList.remove('hidden');
        }
      }
      
      function logout() {
        sessionStorage.removeItem('otc_user');
        currentUser = null;
        showView('login');
      }
    </script>
  </body>
</html>
